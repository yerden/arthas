# fly.io deployment for Arthas (self-hosted all-in-one mode)
#
# Uses deploy/Dockerfile: a single Go binary with the React frontend embedded
# via go:embed, serving both the static UI and the /ws WebSocket relay on one
# port. No database or volume is needed -- all room state is in memory.

app = 'malika-arthas'
primary_region = 'fra'

[build]
  # Build context is the repo root; deploy/Dockerfile COPYs arthas-client/
  # and arthas-server/ from there.
  dockerfile = 'deploy/Dockerfile'

[env]
  PORT = '8080'
  # Restrict WebSocket upgrades to our own origin. The frontend derives its
  # WS URL from window.location, so this must match the served host exactly.
  ALLOWED_ORIGINS = 'https://malika-arthas.fly.dev'

  # Daily topic auto-creates public themed rooms on a schedule, which is noise
  # on a private family instance. Must be the exact string 'true' -- main.go
  # compares against it literally, so 'TRUE' or '1' silently leave it enabled.
  DISABLE_DAILY_TOPIC = 'true'

[http_service]
  internal_port = 8080
  force_https = true

  # Room state lives only in this process's memory, so stopping the machine
  # destroys every active chat. Keep exactly one machine always running and
  # never scale horizontally -- a second machine would not see the first
  # machine's rooms.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # IMPORTANT: always deploy with `fly deploy --ha=false`.
  # There is no fly.toml key for this -- `fly deploy` defaults to creating a
  # SECOND machine for high availability, which silently breaks this app:
  # rooms live in one process's memory, so a client load-balanced to machine B
  # cannot see rooms created on machine A. It also doubles the bill.
  # If a deploy ever adds one back, run: fly scale count 1

  [http_service.concurrency]
    # WebSockets are long-lived, so count connections rather than requests.
    type = 'connections'
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    method = 'GET'
    path = '/ping'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
